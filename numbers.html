<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>English Year 2 - Advanced Games</title>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      font-family: 'Quicksand', sans-serif;
      background: linear-gradient(135deg, #38BDF8 0%, #818CF8 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      overflow-x: hidden;
    }

    .card-container {
      width: 100%;
      max-width: 920px;
      aspect-ratio: 16 / 9;
      background: #FFFFFF;
      border-radius: 32px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2), 0 0 0 10px rgba(255, 255, 255, 0.4);
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      border: 4px solid #F472B6;
      padding: 24px;
    }

    /* Fondo decorativo con ondas */
    .bg-swirl {
      position: absolute;
      pointer-events: none;
      z-index: 1;
    }
    .swirl-top-right { top: -30px; right: -30px; width: 180px; height: 180px; }
    .swirl-bottom-left { bottom: -40px; left: -40px; width: 220px; height: 220px; }

    /* Vistas de pantallas */
    .screen {
      display: none;
      width: 100%;
      height: 100%;
      position: relative;
      z-index: 2;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      animation: fadeIn 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    .screen.active {
      display: flex;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px) scale(0.98); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    .card-title {
      font-family: 'Fredoka One', cursive;
      font-size: 2.6rem;
      color: #312E81;
      text-align: center;
      margin-bottom: 4px;
      text-shadow: 2px 2px 0px #E0E7FF;
    }

    .dotted-line {
      width: 90%;
      border-bottom: 3px dashed #F472B6;
      margin-bottom: 15px;
    }

    /* Barra de navegación superior/inferior */
    .header-bar {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 10;
    }

    .nav-bar {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 10;
      margin-top: 10px;
    }

    .btn {
      font-family: 'Fredoka One', cursive;
      font-size: 1.1rem;
      padding: 10px 24px;
      border: none;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 6px 0 #9333EA;
      background: #C084FC;
      color: white;
      transition: all 0.1s ease;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .btn:hover { transform: translateY(-2px); box-shadow: 0 8px 0 #9333EA; }
    .btn:active { transform: translateY(4px); box-shadow: 0 2px 0 #9333EA; }

    .btn-green { background: #4ADE80; box-shadow: 0 6px 0 #16A34A; }
    .btn-green:hover { box-shadow: 0 8px 0 #16A34A; }
    .btn-green:active { box-shadow: 0 2px 0 #16A34A; }

    .btn-home {
      background: #38BDF8;
      box-shadow: 0 6px 0 #0284C7;
      padding: 8px 16px;
      font-size: 0.95rem;
    }
    .btn-home:hover { box-shadow: 0 8px 0 #0284C7; }

    /* CARD 1: PORTADA */
    .cover-box {
      background: #F8FAFC;
      border: 3px solid #E2E8F0;
      border-radius: 20px;
      padding: 30px 60px;
      text-align: center;
      box-shadow: 0 8px 20px rgba(0,0,0,0.06);
      position: relative;
      background-image: repeating-linear-gradient(#F8FAFC, #F8FAFC 28px, #E2E8F0 29px);
    }
    .tape {
      position: absolute;
      top: -15px; left: 50%; transform: translateX(-50%);
      width: 120px; height: 28px; background: rgba(244, 114, 182, 0.4); border-radius: 4px;
    }
    .cover-title {
      font-family: 'Fredoka One', cursive;
      font-size: 3.5rem; color: #4338CA; line-height: 1.1;
    }

    /* GRILLA DE NÚMEROS */
    .numbers-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 12px;
      width: 85%;
    }
    .num-box {
      font-family: 'Fredoka One', cursive;
      font-size: 2.8rem;
      text-align: center;
      padding: 6px;
      border-radius: 16px;
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
      background: white;
      border: 3px solid #F1F5F9;
      box-shadow: 0 4px 10px rgba(0,0,0,0.05);
    }
    .num-box:hover { transform: scale(1.1); border-color: #CBD5E1; }
    .num-outline { color: transparent; -webkit-text-stroke: 3px #1E293B; }
    .num-colored { text-shadow: 2px 2px 0px rgba(0,0,0,0.1); }

    /* AUDIO PROMPT */
    .audio-prompt {
      font-family: 'Fredoka One', cursive;
      font-size: 1.4rem; color: #0284C7;
      background: #E0F2FE; padding: 8px 20px;
      border-radius: 30px; margin-bottom: 10px;
      cursor: pointer; display: inline-flex; align-items: center; gap: 8px;
      box-shadow: 0 4px 12px rgba(2, 132, 199, 0.1);
      transition: transform 0.1s;
    }
    .audio-prompt:active { transform: scale(0.95); }

    /* JUEGO DE CONTEO */
    .count-container {
      display: flex; flex-direction: column; align-items: center; gap: 15px; width: 90%;
    }
    .items-box {
      font-size: 2.2rem; background: #F8FAFC; border: 3px dashed #CBD5E1;
      border-radius: 16px; padding: 12px 24px; min-height: 80px;
      display: flex; align-items: center; justify-content: center; gap: 10px; flex-wrap: wrap;
    }
    .options-row { display: flex; gap: 15px; }
    .opt-btn {
      font-family: 'Fredoka One', cursive; font-size: 1.8rem;
      width: 65px; height: 65px; border-radius: 50%;
      border: 3px solid #CBD5E1; background: white; cursor: pointer;
      transition: all 0.2s;
    }
    .opt-btn:hover { transform: scale(1.1); border-color: #3B82F6; background: #EFF6FF; }

    /* PANTALLA FINAL VICTORIA */
    .victory-box {
      text-align: center; display: flex; flex-direction: column; align-items: center; gap: 15px;
    }
    .trophy-icon { font-size: 5rem; animation: bounce 1s infinite alternate; }
    @keyframes bounce { from { transform: translateY(0); } to { transform: translateY(-15px); } }

    @media (max-width: 768px) {
      .card-title { font-size: 2rem; }
      .cover-title { font-size: 2.4rem; }
      .numbers-grid { gap: 8px; }
      .num-box { font-size: 2rem; }
    }
  </style>
</head>
<body>

  <div class="card-container">
    <!-- SVG Ondas decorativas -->
    <svg class="bg-swirl swirl-top-right" viewBox="0 0 200 200">
      <path d="M 20 100 A 80 80 0 1 1 180 100" fill="none" stroke="#F472B6" stroke-width="28" stroke-linecap="round"/>
    </svg>
    <svg class="bg-swirl swirl-bottom-left" viewBox="0 0 200 200">
      <path d="M 20 100 A 80 80 0 1 0 180 100" fill="none" stroke="#F472B6" stroke-width="32" stroke-linecap="round"/>
    </svg>

    <!-- CARD 1: PORTADA -->
    <div class="screen active" id="card-1">
      <div style="flex:1; display:flex; flex-direction:column; justify-content:center; align-items:center;">
        <div class="cover-box">
          <div class="tape"></div>
          <h1 class="cover-title">English<br>Numbers</h1>
        </div>
      </div>
      <div class="nav-bar" style="justify-content: center;">
        <button class="btn btn-green" onclick="goToCard(2)">START GAMES! ➔</button>
      </div>
    </div>

    <!-- CARD 2: TRACE & COLOR -->
    <div class="screen" id="card-2">
      <div class="header-bar">
        <h2 class="card-title" style="font-size: 2rem;">1. Trace & Color</h2>
        <button class="btn btn-home" onclick="goToCard(1)">🏠 Return</button>
      </div>
      <div class="dotted-line"></div>
      <p style="font-family:'Fredoka One'; color:#64748B; margin-bottom:10px; font-size:0.95rem;">Tap each number to color and listen!</p>
      <div class="numbers-grid" id="outline-numbers-grid"></div>
      <div class="nav-bar">
        <button class="btn" onclick="goToCard(1)">◀ Back</button>
        <button class="btn btn-green" onclick="goToCard(3)">Next ➔</button>
      </div>
    </div>

    <!-- CARD 3: LISTEN & FIND -->
    <div class="screen" id="card-3">
      <div class="header-bar">
        <h2 class="card-title" style="font-size: 2rem;">2. Listen & Find</h2>
        <button class="btn btn-home" onclick="goToCard(1)">🏠 Return</button>
      </div>
      <div class="dotted-line"></div>
      <div class="audio-prompt" onclick="playCurrentTargetAudio()">
        🔊 <span id="audio-target-text">Find number...</span>
      </div>
      <div class="numbers-grid" id="colored-numbers-grid"></div>
      <div class="nav-bar">
        <button class="btn" onclick="goToCard(2)">◀ Back</button>
        <button class="btn btn-green" onclick="goToCard(4)">Next ➔</button>
      </div>
    </div>

    <!-- CARD 4: COUNTING -->
    <div class="screen" id="card-4">
      <div class="header-bar">
        <h2 class="card-title" style="font-size: 2rem;">3. Count & Click</h2>
        <button class="btn btn-home" onclick="goToCard(1)">🏠 Return</button>
      </div>
      <div class="dotted-line"></div>
      <div class="count-container">
        <div class="items-box" id="count-items-display">🍎🍎🍎</div>
        <p style="font-family:'Fredoka One'; color:#475569; font-size:1.1rem;">How many objects are there?</p>
        <div class="options-row" id="count-options-row"></div>
      </div>
      <div class="nav-bar">
        <button class="btn" onclick="goToCard(3)">◀ Back</button>
        <button class="btn btn-green" onclick="goToCard(5)">Next ➔</button>
      </div>
    </div>

    <!-- CARD 5: ORDER NUMBERS -->
    <div class="screen" id="card-5">
      <div class="header-bar">
        <h2 class="card-title" style="font-size: 2rem;">4. Order 1 to 5</h2>
        <button class="btn btn-home" onclick="goToCard(1)">🏠 Return</button>
      </div>
      <div class="dotted-line"></div>
      <p style="font-family:'Fredoka One'; color:#64748B; margin-bottom:15px; font-size:0.95rem;">Tap the numbers from 1 to 5 in order!</p>
      <div class="options-row" id="order-numbers-row" style="gap: 15px; justify-content: center;"></div>
      <div class="nav-bar" style="margin-top: 25px;">
        <button class="btn" onclick="goToCard(4)">◀ Back</button>
        <button class="btn btn-green" onclick="finishGame()">Finish! 🎉</button>
      </div>
    </div>

    <!-- CARD 6: PANTALLA FINAL VICTORIA -->
    <div class="screen" id="card-6">
      <div class="victory-box">
        <div class="trophy-icon">🏆</div>
        <h2 class="card-title" style="font-size: 3rem;">WELL DONE!</h2>
        <p style="font-family:'Fredoka One'; color:#475569; font-size: 1.3rem;">You mastered all the number games!</p>
        <button class="btn btn-green" style="font-size: 1.4rem; padding: 14px 36px; margin-top: 15px;" onclick="goToCard(1)">🔄 Play Again (Return)</button>
      </div>
    </div>

  </div>

  <script>
    let currentTargetNumber = 1;
    let currentCountTarget = 3;
    let nextExpectedOrder = 1;

    const colors = [
      '#EF4444', '#84CC16', '#F97316', '#EC4899', '#14B8A6', 
      '#EAB308', '#7C3AED', '#8B5CF6', '#3B82F6', '#0284C7'
    ];
    const emojis = ['🍎', '⭐', '🎈', '🐱', '🚗', '🍬', '⚽', '🐟'];

    function speak(text) {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'en-US';
        utterance.rate = 0.85;
        window.speechSynthesis.speak(utterance);
      }
    }

    function goToCard(cardNumber) {
      document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
      const activeScreen = document.getElementById(`card-${cardNumber}`);
      if (activeScreen) activeScreen.classList.add('active');

      if (cardNumber === 2) initCard2();
      if (cardNumber === 3) initCard3();
      if (cardNumber === 4) initCard4();
      if (cardNumber === 5) initCard5();
    }

    function initCard2() {
      const grid = document.getElementById('outline-numbers-grid');
      grid.innerHTML = '';
      for (let i = 1; i <= 10; i++) {
        const box = document.createElement('div');
        box.className = 'num-box num-outline';
        box.innerText = i;
        box.onclick = () => {
          box.classList.remove('num-outline');
          box.style.color = colors[i - 1];
          speak(i.toString());
        };
        grid.appendChild(box);
      }
    }

    function initCard3() {
      const grid = document.getElementById('colored-numbers-grid');
      grid.innerHTML = '';
      currentTargetNumber = Math.floor(Math.random() * 10) + 1;

      for (let i = 1; i <= 10; i++) {
        const box = document.createElement('div');
        box.className = 'num-box num-colored';
        box.innerText = i;
        box.style.color = colors[i - 1];
        box.onclick = () => {
          if (i === currentTargetNumber) {
            speak(`Great job! That is ${i}`);
            confetti({ particleCount: 50, spread: 60, origin: { y: 0.7 } });
            setTimeout(initCard3, 1200);
          } else {
            speak(`Try again! Find number ${currentTargetNumber}`);
          }
        };
        grid.appendChild(box);
      }
      playCurrentTargetAudio();
    }

    function playCurrentTargetAudio() {
      document.getElementById('audio-target-text').innerText = `Find Number ${currentTargetNumber}!`;
      speak(`Touch number ${currentTargetNumber}`);
    }

    function initCard4() {
      currentCountTarget = Math.floor(Math.random() * 5) + 1;
      const emoji = emojis[Math.floor(Math.random() * emojis.length)];
      document.getElementById('count-items-display').innerText = emoji.repeat(currentCountTarget);
      speak(`How many?`);

      const optionsRow = document.getElementById('count-options-row');
      optionsRow.innerHTML = '';

      let choices = [currentCountTarget];
      while (choices.length < 3) {
        let rand = Math.floor(Math.random() * 5) + 1;
        if (!choices.includes(rand)) choices.push(rand);
      }
      choices.sort(() => Math.random() - 0.5);

      choices.forEach(num => {
        const btn = document.createElement('button');
        btn.className = 'opt-btn';
        btn.innerText = num;
        btn.onclick = () => {
          if (num === currentCountTarget) {
            speak(`Correct! It is ${num}`);
            confetti({ particleCount: 60, spread: 70, origin: { y: 0.7 } });
            setTimeout(initCard4, 1200);
          } else {
            speak('Try again!');
          }
        };
        optionsRow.appendChild(btn);
      });
    }

    function initCard5() {
      nextExpectedOrder = 1;
      const orderRow = document.getElementById('order-numbers-row');
      orderRow.innerHTML = '';

      let nums = [1, 2, 3, 4, 5].sort(() => Math.random() - 0.5);
      nums.forEach(num => {
        const btn = document.createElement('button');
        btn.className = 'opt-btn';
        btn.innerText = num;
        btn.style.fontSize = '1.5rem';
        btn.onclick = () => {
          if (num === nextExpectedOrder) {
            speak(num.toString());
            btn.style.opacity = '0.3';
            btn.style.pointerEvents = 'none';
            nextExpectedOrder++;
            if (nextExpectedOrder > 5) {
              speak('Awesome! You ordered all numbers!');
              confetti({ particleCount: 100, spread: 90, origin: { y: 0.6 } });
              setTimeout(() => goToCard(6), 1500);
            }
          } else {
            speak('Oops! Find the next number.');
          }
        };
        orderRow.appendChild(btn);
      });
    }

    function finishGame() {
      confetti({ particleCount: 120, spread: 100, origin: { y: 0.5 } });
      speak('Congratulations! Great job with numbers!');
      goToCard(6);
    }
  </script>
</body>
</html>
