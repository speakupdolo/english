<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calendar Routine</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Outfit:wght@600;800;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Fredoka', sans-serif;
            background-color: #F8F4EE;
            background-image: radial-gradient(#E0DCD2 1.5px, transparent 1.5px);
            background-size: 24px 24px;
            user-select: none;
            -webkit-user-select: none;
            overflow-x: hidden;
        }

        /* Paper Card Container */
        .paper-card {
            background-color: #FBF9F5;
            box-shadow: 0 20px 40px -10px rgba(13, 27, 62, 0.08), 0 8px 16px -6px rgba(13, 27, 62, 0.04);
            border: 6px solid #FFFFFF;
            border-radius: 36px;
        }

        /* Speech Bubble Question Header */
        .speech-bubble {
            background: #FFFFFF;
            border-radius: 28px;
            padding: 12px 32px;
            box-shadow: 0 8px 24px rgba(13, 27, 62, 0.04);
            border: 2px solid #EFEAE0;
            display: inline-block;
            color: #0D1B3E;
        }

        /* Kid-Friendly Interactive Buttons */
        .btn-kid {
            transition: transform 0.15s cubic-bezier(0.34, 1.56, 0.64, 1), background-color 0.2s, box-shadow 0.2s, border-color 0.2s;
            cursor: pointer;
            touch-action: manipulation;
        }

        .btn-kid:hover {
            transform: scale(1.03) translateY(-2px);
        }

        .btn-kid:active {
            transform: scale(0.97) translateY(2px);
        }

        /* Playful Animations */
        @keyframes gentleFloat {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-6px) rotate(1deg); }
        }

        @keyframes gentlePulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.04); }
        }

        @keyframes shakeWrong {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-8px); }
            40%, 80% { transform: translateX(8px); }
        }

        @keyframes successPop {
            0% { transform: scale(0.85); opacity: 0; }
            60% { transform: scale(1.08); }
            100% { transform: scale(1); opacity: 1; }
        }

        .animate-float { animation: gentleFloat 4s ease-in-out infinite; }
        .animate-pulse-gentle { animation: gentlePulse 2.5s ease-in-out infinite; }
        .animate-shake { animation: shakeWrong 0.45s ease-in-out; }
        .animate-success { animation: successPop 0.35s ease-out forwards; }

        .font-card-title {
            font-family: 'Outfit', sans-serif;
            letter-spacing: -0.02em;
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-3 sm:p-6 text-[#0D1B3E]">

    <!-- MAIN APP CONTAINER CARD (Fixed Aspect Ratio Desktop & Fluid Mobile) -->

            <!-- Sound/Voice Toggle Button -->

            <!-- Next Button -->

    <script>
        // --- GAME STATE ---
        let currentCard = 1; // 1 to 8
        let selectedDay = null;
        let selectedSeason = null;
        let selectedWeather = null;
        let soundEnabled = true;

        // --- REAL DATE CALCULATIONS ---
        const todayDate = new Date();
        const dayIndex = todayDate.getDay(); // 0 = Sun, 1 = Mon, ..., 6 = Sat
        const isWeekend = (dayIndex === 0 || dayIndex === 6);
        
        // 5 School Days Only
        const WEEKDAYS_MAP = {
            1: 'MONDAY',
            2: 'TUESDAY',
            3: 'WEDNESDAY',
            4: 'THURSDAY',
            5: 'FRIDAY'
        };
        const actualTodayName = isWeekend ? 'FRIDAY' : WEEKDAYS_MAP[dayIndex];

        function getActualSeason() {
            const month = todayDate.getMonth(); // 0-11
            if (month >= 2 && month <= 4) return 'SPRING';
            if (month >= 5 && month <= 7) return 'SUMMER';
            if (month >= 8 && month <= 10) return 'AUTUMN';
            return 'WINTER';
        }
        const actualSeasonName = getActualSeason();

        // --- AUDIO SYNTHESIS & SOUND EFFECTS ---
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        let audioCtx = null;

        function initAudio() {
            if (!audioCtx) audioCtx = new AudioCtx();
        }

        function playTone(type) {
            if (!soundEnabled) return;
            initAudio();
            if (!audioCtx) return;

            const now = audioCtx.currentTime;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            if (type === 'click') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(450, now);
                osc.frequency.exponentialRampToValueAtTime(750, now + 0.08);
                gain.gain.setValueAtTime(0.15, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.08);
                osc.start(now);
                osc.stop(now + 0.08);
            } else if (type === 'correct') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(523.25, now); // C5
                osc.frequency.setValueAtTime(659.25, now + 0.09); // E5
                osc.frequency.setValueAtTime(783.99, now + 0.18); // G5
                gain.gain.setValueAtTime(0.2, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.35);
                osc.start(now);
                osc.stop(now + 0.35);
            } else if (type === 'wrong') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(220, now);
                osc.frequency.setValueAtTime(180, now + 0.15);
                gain.gain.setValueAtTime(0.2, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
                osc.start(now);
                osc.stop(now + 0.3);
            } else if (type === 'win') {
                [523.25, 659.25, 783.99, 1046.50].forEach((f, i) => {
                    const o = audioCtx.createOscillator();
                    const g = audioCtx.createGain();
                    o.connect(g);
                    g.connect(audioCtx.destination);
                    o.type = 'sine';
                    o.frequency.setValueAtTime(f, now + i * 0.09);
                    g.gain.setValueAtTime(0.2, now + i * 0.09);
                    g.gain.exponentialRampToValueAtTime(0.001, now + i * 0.09 + 0.25);
                    o.start(now + i * 0.09);
                    o.stop(now + i * 0.09 + 0.25);
                });
            }
        }

        function speak(text) {
            if (!soundEnabled || !('speechSynthesis' in window)) return;
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'en-US';
            utterance.rate = 0.9;
            utterance.pitch = 1.1;
            window.speechSynthesis.speak(utterance);
        }

        function toggleAudio() {
            soundEnabled = !soundEnabled;
            document.getElementById('sound-icon').innerText = soundEnabled ? '🔊' : '🔇';
            document.getElementById('sound-text').innerText = soundEnabled ? 'Voice: ON' : 'Voice: OFF';
            if (!soundEnabled && 'speechSynthesis' in window) {
                window.speechSynthesis.cancel();
            }

        // --- GAME DATA MODELS ---
        // Exactly 5 school days (EXCLUDING Saturday and Sunday)
        const SCHOOL_DAYS = [
            { key: 'M', name: 'MONDAY' },
            { key: 'T', name: 'TUESDAY' },
            { key: 'W', name: 'WEDNESDAY' },
            { key: 'T', name: 'THURSDAY' },
            { key: 'F', name: 'FRIDAY' }
        ];

        const ALL_SEASONS = [
            { name: 'AUTUMN', icon: '🍂' },
            { name: 'WINTER', icon: '❄️' },
            { name: 'SPRING', icon: '🌸' },
            { name: 'SUMMER', icon: '☀️' }
        ];

        const ALL_WEATHERS = [
            { name: 'SUNNY', icon: '☀️' },
            { name: 'SNOWY', icon: '❄️' },
            { name: 'RAINY', icon: '🌧️' },
            { name: 'CLOUDY', icon: '☁️' },
            { name: 'STORMY', icon: '🌩️' },
            { name: 'WINDY', icon: '💨' }
        ];

        // --- RENDER CURRENT CARD ---
        function renderGame() {
            const header = document.getElementById('card-header');
            const body = document.getElementById('card-body');
            const btnPrev = document.getElementById('btn-prev');
            const nextText = document.getElementById('next-text');

            // Previous Button Visibility
            if (currentCard === 1) {
                btnPrev.classList.add('opacity-0', 'pointer-events-none');
            } else {
                btnPrev.classList.remove('opacity-0', 'pointer-events-none');
            }

            // Next Button Config
            nextText.innerText = (currentCard === 8) ? "Play Again 🔄" : "Next";

            switch(currentCard) {

                // CARD 1: COVER
                case 1:
                    speak("Calendar Routine!");
                    header.innerHTML = `
                        <div class="flex flex-col items-center">
                            <h1 class="text-3xl sm:text-5xl font-black font-card-title text-[#0D1B3E] tracking-tight">CALENDAR ROUTINE</h1>
                            <span class="bg-pink-300 text-pink-950 font-extrabold px-5 py-0.5 rounded-full text-sm sm:text-base mt-1 shadow-sm"></span>
                        </div>
                    `;
                    body.innerHTML = SVG_ART.card1Cover;
                    break;

                // CARD 2: WHAT DAY IS IT? (5 SCHOOL DAYS ONLY: M, T, W, T, F)
                case 2:
                    speak("What day of the week is it?");
                    header.innerHTML = `
                        <div class="flex flex-col items-center">
                            <div class="speech-bubble text-xl sm:text-3xl font-extrabold">What day of the week is it?</div>
                            ${isWeekend ? '<span class="text-xs font-bold text-amber-700 bg-amber-100 px-3 py-0.5 rounded-full mt-1">Weekend Mode: Select Friday or Monday!</span>' : ''}

                    body.innerHTML = `
                        <div class="w-full flex items-center justify-around px-1">
                            <div class="hidden sm:block">${SVG_ART.blueGiant}</div>
                            <div id="days-container" class="flex flex-col gap-2 w-full max-w-xs my-auto">
                                ${SCHOOL_DAYS.map(d => `
                                    <button onclick="checkDay('${d.name}', this)" class="btn-kid flex items-center gap-3.5 bg-white hover:bg-slate-50 p-2 sm:p-2.5 rounded-2xl shadow-sm border-2 border-slate-100 text-left">

                    break;

                    speak("It's " + selectedDay);
                    header.innerHTML = `<div class="speech-bubble text-xl sm:text-3xl font-extrabold">What day of the week is it?</div>`;
                    body.innerHTML = `
                        <div class="w-full flex items-center justify-around px-2">
                            ${SVG_ART.blueGiant}
                            <div class="bg-white px-6 sm:px-10 py-8 rounded-3xl shadow-sm border-2 border-slate-100 text-center flex-1 max-w-md mx-2">
                                <span class="text-3xl sm:text-5xl font-black text-[#0D1B3E]">It's </span>
                                <span class="text-3xl sm:text-5xl font-black text-pink-500 underline decoration-pink-300 decoration-4 underline-offset-8">${selectedDay}</span>
                            </div>
                            <div class="hidden sm:block">${SVG_ART.pinkBlob}</div>
                        </div>
                    `;
                    break;

                // CARD 4: WHAT SEASON IS IT?
                case 4:
                    speak("What season is it?");
                    header.innerHTML = `<div class="speech-bubble text-xl sm:text-3xl font-extrabold">What season is it?</div>`;
                    body.innerHTML = `
                        <div class="w-full flex items-center justify-around px-1">
                            <div class="hidden sm:block">${SVG_ART.mountainCharacter}</div>
                            <div id="seasons-container" class="flex flex-col gap-2.5 w-full max-w-xs my-auto">
                                ${ALL_SEASONS.map(s => `
                                    <button onclick="checkSeason('${s.name}', this)" class="btn-kid flex items-center gap-3.5 bg-white hover:bg-slate-50 p-2.5 sm:p-3 rounded-2xl shadow-sm border-2 border-slate-100 text-left">
                                        <span class="w-10 h-10 rounded-full bg-amber-400 text-xl flex items-center justify-center shadow-inner shrink-0">${s.icon}</span>
                                        <span class="text-xl font-black text-slate-700 tracking-wide">${s.name}</span>
                                    </button>
                                `).join('')}
                            </div>
                            <div class="hidden sm:block">${SVG_ART.yellowRainbow}</div>
                        </div>
                    `;
                    break;

                // CARD 5: IT'S [SEASON]
                case 5:
                    speak("It's " + selectedSeason);
                    header.innerHTML = `<div class="speech-bubble text-xl sm:text-3xl font-extrabold">What season is it?</div>`;
                    body.innerHTML = `
                        <div class="w-full flex items-center justify-around px-2">
                            ${SVG_ART.mountainCharacter}
                            <div class="bg-white px-6 sm:px-10 py-8 rounded-3xl shadow-sm border-2 border-slate-100 text-center flex-1 max-w-md mx-2">
                                <span class="text-3xl sm:text-5xl font-black text-[#0D1B3E]">It's </span>
                                <span class="text-3xl sm:text-5xl font-black text-amber-500 underline decoration-amber-300 decoration-4 underline-offset-8">${selectedSeason}</span>
                            </div>
                            <div class="hidden sm:block">${SVG_ART.yellowRainbow}</div>
                        </div>
                    `;
                    break;

                // CARD 6: WHAT IS THE WEATHER LIKE?
                case 6:
                    speak("What is the weather like?");
                    header.innerHTML = `<div class="speech-bubble text-xl sm:text-3xl font-extrabold">What is the weather like?</div>`;
                    body.innerHTML = `
                        <div class="w-full flex flex-col items-center justify-center gap-3 px-2">
                            <div class="grid grid-cols-2 sm:grid-cols-3 gap-2.5 sm:gap-3.5 w-full max-w-xl">
                                ${ALL_WEATHERS.map(w => `
                                    <button onclick="chooseWeather('${w.name}')" class="btn-kid bg-white hover:bg-slate-50 p-3 sm:p-4 rounded-3xl shadow-sm border-2 border-slate-100 flex flex-col items-center gap-1.5">
                                        <span class="text-3xl sm:text-4xl">${w.icon}</span>
                                        <span class="text-base sm:text-lg font-black text-slate-700">${w.name}</span>
                                    </button>
                                `).join('')}
                            </div>
                            <div class="flex items-center gap-3 mt-1">
                                ${SVG_ART.pinkStripedDragon}
                                ${SVG_ART.orangeStarburst}
                            </div>
                        </div>
                    `;
                    break;

                // CARD 7: IT'S [WEATHER]
                case 7:
                    speak("It's " + selectedWeather);
                    header.innerHTML = `<div class="speech-bubble text-xl sm:text-3xl font-extrabold">What is the weather like?</div>`;
                    body.innerHTML = `
                        <div class="w-full flex items-center justify-around px-2">
                            <div class="bg-white px-6 sm:px-10 py-8 rounded-3xl shadow-sm border-2 border-slate-100 text-center flex-1 max-w-md mx-2 z-10">
                                <span class="text-3xl sm:text-5xl font-black text-[#0D1B3E]">It's </span>
                                <span class="text-3xl sm:text-5xl font-black text-rose-500 underline decoration-rose-300 decoration-4 underline-offset-8">${selectedWeather}</span>
                            </div>
                            <div class="flex items-center gap-2">
                                ${SVG_ART.pinkStripedDragon}
                                ${SVG_ART.orangeStarburst}
                            </div>
                        </div>
                    `;
                    break;

                // CARD 8: WELL DONE! (COMPLETION)
                case 8:
                    playTone('win');
                    triggerConfetti();
                    speak("Well done! Enjoy today's class!");

                    header.innerHTML = `
                        <div class="flex flex-col items-center">
                            <h1 class="text-3xl sm:text-5xl font-black font-card-title text-[#0D1B3E] tracking-tight">WELL DONE!</h1>
                            <div class="speech-bubble mt-1.5 text-lg sm:text-2xl font-extrabold text-indigo-700">Enjoy today's class!</div>
                        </div>
                    `;
                    body.innerHTML = `
                        <div class="w-full flex items-center justify-around px-4">
                            ${SVG_ART.completionGirl}
                            <div class="bg-white p-5 rounded-3xl border-2 border-amber-200 shadow-sm max-w-xs sm:max-w-sm w-full space-y-2.5 text-center">
                                <h3 class="text-lg font-black text-slate-700 border-b pb-1.5">Today's Calendar Summary</h3>
                                <div class="bg-pink-50 p-2.5 rounded-2xl text-base font-black text-pink-700 flex justify-between">
                                    <span>📅 Day:</span> <span>${selectedDay || actualTodayName}</span>
                                </div>
                                <div class="bg-amber-50 p-2.5 rounded-2xl text-base font-black text-amber-700 flex justify-between">
                                    <span>🍂 Season:</span> <span>${selectedSeason || actualSeasonName}</span>
                                </div>
                                <div class="bg-rose-50 p-2.5 rounded-2xl text-base font-black text-rose-700 flex justify-between">
                                    <span>☀️ Weather:</span> <span>${selectedWeather || 'SUNNY'}</span>
                                </div>
                            </div>
                        </div>
                    `;
                    break;
            }
        }

        // --- VERIFICATION HANDLERS ---
        function checkDay(dayName, btnElement) {
            // On weekends, allow any weekday selected or match real day on weekdays
            const isCorrect = isWeekend ? true : (dayName === actualTodayName);

            if (isCorrect) {
                playTone('correct');
                selectedDay = dayName;
                btnElement.classList.add('bg-emerald-500', 'text-white', 'border-emerald-600', 'animate-success');
                speak("Super! Today is " + dayName);
                setTimeout(() => {
                    currentCard = 3;
                    renderGame();
                }, 900);
            } else {
                playTone('wrong');
                speak("Try again! Today is not " + dayName);
                btnElement.classList.add('animate-shake', 'bg-rose-100', 'border-rose-300');
                setTimeout(() => {
                    btnElement.classList.remove('animate-shake');
                }, 500);
            }
        }

        function checkSeason(seasonName, btnElement) {
            if (seasonName === actualSeasonName) {
                playTone('correct');
                selectedSeason = seasonName;
                btnElement.classList.add('bg-emerald-500', 'text-white', 'border-emerald-600', 'animate-success');
                speak("Great job! It's " + seasonName);
                setTimeout(() => {
                    currentCard = 5;
                    renderGame();
                }, 900);
            } else {
                playTone('wrong');
                speak("Try again! It is not " + seasonName);
                btnElement.classList.add('animate-shake', 'bg-rose-100', 'border-rose-300');
                setTimeout(() => {
                    btnElement.classList.remove('animate-shake');
                }, 500);
            }
        }

        function chooseWeather(weatherName) {
            playTone('click');
            selectedWeather = weatherName;
            currentCard = 7;
            renderGame();
        }

        // --- NAVIGATION ---
        function nextCard() {
            playTone('click');
            if (currentCard < 8) {
                // Auto-fill defaults if skipping manual button check
                if (currentCard === 2 && !selectedDay) selectedDay = actualTodayName;
                if (currentCard === 4 && !selectedSeason) selectedSeason = actualSeasonName;
                if (currentCard === 6 && !selectedWeather) selectedWeather = 'SUNNY';
                
                currentCard++;
            } else {
                // Restart Game
                currentCard = 1;
                selectedDay = null;
                selectedSeason = null;
                selectedWeather = null;
            }
            renderGame();
        }

        function prevCard() {
            playTone('click');
            if (currentCard > 1) {
                currentCard--;
                renderGame();
            }
        }

        function triggerConfetti() {
            if (typeof confetti === 'function') {
                confetti({
                    particleCount: 120,
                    spread: 80,
                    origin: { y: 0.6 }
                });
            }
        }

        // --- INITIALIZE ON WINDOW LOAD ---
        window.onload = function() {
            renderGame();
        };
    </script>
</body>
</html>
